# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.0"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "paper-110-common-ground"
class = "paper"
kind = "paper"
status = "draft"
since = "2026"
summary = "Paper characterizing fragment-relative Referential Common Ground in classical propositional logic, including the insufficiency of admissibility alone and the conditions under which frameworks are neutral on a vocabulary."

# === Layer Position ===

[layer]
space = "structural-explainability"
role = "justification-neutrality"

# === Dependency Declarations ===

[depends]
required = []
optional = []

# === Provided Artifacts ===

[provides]
artifacts = [
    ".annotations/annotations.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "SE_MANIFEST.toml",
    "se110-common-ground.tex",
]

# === Scope ===

[scope]
includes = [
    "classical propositional logic and satisfiability",
    "bounded satisfiable nontrivial referential fragments",
    "joint consistency over disjoint vocabularies",
    "framework valuation-permission interfaces",
    "compatibility of fragment theories with frameworks",
    "framework neutrality on a vocabulary",
    "characterization of vocabulary neutrality by compatibility with every satisfiable theory over that vocabulary",
    "neutrality and conflict dichotomy",
    "independence of common ground from admissibility alone",
    "fragment-relative common ground under stated scope conditions",
    "machine-checked Lean results",
    "worked decision-record example",
]

excludes = [
    "proof of global Referential Common Ground for all admissible frameworks",
    "independent justification that a particular fragment is genuinely referential",
    "first-order logic with equality",
    "identity-bearing fragments",
    "definition of Neutral Substrate design constraints and attribution semantics",
    "independent validation of concrete information systems",
    "adjudication among competing interpretations",
    "runtime implementations and data format specifications",
]

# === Citation ===

[citation]
cff = "CITATION.cff"
preferred = "paper"

# === Traceability ===

[traceability]
identifier_map = "none"
